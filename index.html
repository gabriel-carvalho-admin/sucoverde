<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suco Verde – Peça Online</title>
<meta name="description" content="Cardápio e pedidos online da Suco Verde, na Ceasa de Teresina. Entrega grátis na Ceasa.">
<meta name="theme-color" content="#1f6b2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style id="css">
/* Layout: cardápio de uma coluna, pensado para celular; barra do pedido fixa embaixo; ficha do item e sacola sobem como folhas. Tema único, nas cores do cardápio impresso. */
:root{
  --leaf:#1f6b2a;      /* verde principal (logo) */
  --lime:#6cad2f;      /* verde claro */
  --bark:#6b3a1e;      /* marrom dos títulos */
  --sun:#e8821e;       /* laranja dos sucos */
  --paper:#fbf4e6;     /* fundo creme */
  --card:#fffaf1;
  --ink:#2b2118;
  --muted:#7a6a58;
  --line:#ead9bd;
  --danger:#b3261e;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:96px}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* Topo */
header.top{padding:18px 0 8px}
.brand{display:flex;gap:16px;align-items:center}
.brand img{width:132px;height:auto;border-radius:18px;box-shadow:0 4px 14px rgba(107,58,30,.15)}
.brand h1{font-family:var(--display);font-weight:800;color:var(--bark);font-size:1.7rem;line-height:1.05;margin:0 0 6px;text-wrap:balance}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;padding:4px 12px;border-radius:999px}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.status.open{background:#e3f1d6;color:var(--leaf)}
.status.closed{background:#f6e0d6;color:var(--danger)}
.status-note{display:block;color:var(--muted);font-size:.88rem;margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;padding:0;list-style:none}
.facts li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:.88rem;font-weight:700;color:var(--bark)}

/* Navegação de categorias */
nav.cats{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-top:10px}
nav.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
nav.cats a{flex:none;text-decoration:none;font-weight:800;font-size:.9rem;color:var(--leaf);border:2px solid var(--leaf);border-radius:999px;padding:5px 14px;background:var(--card)}
nav.cats a.on{background:var(--leaf);color:#fff}

/* Seções */
section.cat{padding-top:22px;scroll-margin-top:62px}
.cat-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.cat-head h2{font-family:var(--display);font-weight:800;font-size:1.45rem;color:var(--bark);margin:0;line-height:1.1}
.cat-head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.cat-photo{width:100%;height:132px;object-fit:cover;border-radius:16px;margin-bottom:10px}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;color:inherit}
.item:hover{border-color:var(--lime)}
.item .nm{font-weight:800;display:block}
.item .ds{display:block;color:var(--muted);font-size:.85rem;line-height:1.3;margin-top:2px}
.item .pr{font-weight:800;color:var(--bark);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .add{width:34px;height:34px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:1.3rem;font-weight:800;line-height:1}
.item .incart{background:var(--sun);color:#fff;border-radius:999px;font-size:.75rem;font-weight:800;padding:1px 8px;margin-left:6px;vertical-align:2px}
.tag{display:inline-block;background:#fde8cf;color:#9a4d07;font-size:.72rem;font-weight:800;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
footer.foot{margin:34px 0 10px;color:var(--muted);font-size:.85rem;text-align:center}

/* Barra do pedido */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 70%,transparent)}
.cartbar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:688px;margin:0 auto;border:0;border-radius:16px;background:var(--leaf);color:#fff;padding:14px 18px;font-weight:800;font-size:1.02rem;box-shadow:0 6px 18px rgba(31,107,42,.35)}
.cartbar .count{background:#fff;color:var(--leaf);border-radius:999px;padding:0 9px;margin-right:8px}
.cartbar[hidden]{display:none}

/* Folhas (modal) */
.veil{position:fixed;inset:0;z-index:20;background:rgba(43,33,24,.5);display:flex;align-items:flex-end;justify-content:center}
.veil[hidden]{display:none}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:760px){.veil{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h3{font-family:var(--display);font-size:1.4rem;color:var(--bark);margin:0;line-height:1.15}
.sheet .sub{color:var(--muted);margin:4px 0 0}
.x{border:0;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:1.3rem;color:var(--bark);flex:none}
fieldset{border:0;padding:0;margin:18px 0 0}
legend{font-weight:800;color:var(--bark);margin-bottom:8px;padding:0}
legend small{font-weight:600;color:var(--muted)}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--leaf);margin:0}
.opt .ep{margin-left:auto;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.opt:has(input:checked){border-color:var(--leaf);background:#eef6e6}
.opt:has(input:disabled){opacity:.5}
label.lbl{display:block;font-weight:800;color:var(--bark);margin:16px 0 6px}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.err{color:var(--danger);font-weight:700;font-size:.88rem;margin:6px 0 0}
.err:empty{display:none}
.row-end{display:flex;gap:12px;align-items:center;margin-top:20px}
.stepper{display:flex;align-items:center;border:2px solid var(--leaf);border-radius:14px;overflow:hidden;flex:none}
.stepper button{border:0;background:transparent;width:40px;height:44px;font-size:1.3rem;font-weight:800;color:var(--leaf)}
.stepper output{min-width:28px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.primary{flex:1;border:0;border-radius:14px;background:var(--leaf);color:#fff;font-weight:800;padding:13px 16px;font-size:1rem;display:flex;justify-content:space-between;gap:8px;text-decoration:none;align-items:center}
.primary.wa{background:#1fa855;justify-content:center}
.primary[aria-disabled=true]{background:#9aa58f;cursor:not-allowed}

/* Sacola */
.lines{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.line{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.line .nm{font-weight:800}
.line .det{grid-column:1/-1;color:var(--muted);font-size:.85rem;line-height:1.3}
.line .pr{font-weight:800;color:var(--bark);font-variant-numeric:tabular-nums;text-align:right}
.line .ctl{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:4px}
.line .ctl button{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:34px;height:32px;font-weight:800;color:var(--leaf)}
.line .ctl .rm{margin-left:auto;color:var(--danger);padding:0 10px;font-size:.85rem}
.totals{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;margin:14px 2px 0;font-variant-numeric:tabular-nums}
.totals small{display:block;font-size:.82rem;color:var(--lime);font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.four{grid-template-columns:1fr 1fr}
.closed-box{background:#f6e0d6;color:var(--danger);font-weight:700;border-radius:12px;padding:10px 12px;margin-top:16px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.hint{color:var(--muted);font-size:.82rem;margin-top:8px;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* Esgotado */
.item.off{opacity:.55;cursor:not-allowed}
.item.off .add{background:#b9b0a3}
.tag.soldout{background:#eee3d4;color:var(--muted)}

/* Gerenciar cardápio (só o dono) */
.owner-btn{margin-top:12px;border:2px dashed var(--bark);background:transparent;color:var(--bark);font-weight:800;border-radius:12px;padding:8px 14px;font-size:.9rem}
.owner-btn[hidden]{display:none}
.switch{margin-top:14px}
.switch small{color:var(--muted);font-weight:600}
.ad-cat{font-family:var(--display);color:var(--bark);font-size:1.1rem;margin:20px 0 8px}
.ad-list{display:grid;gap:6px}
.ad-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ad-row.is-off{background:#f1e9dc}
.ad-row.is-off .ad-av span{text-decoration:line-through;color:var(--muted)}
.ad-av{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-weight:700;cursor:pointer}
.ad-av input{width:20px;height:20px;accent-color:var(--leaf);flex:none}
.ad-pr{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--muted);flex:none}
.ad-pr input{width:78px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums;background:#fff}
.ad-pr input.bad{border-color:var(--danger);background:#fdecea}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ad-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--paper);padding:12px 0 4px;margin-top:12px;border-top:1px solid var(--line)}

.primary:disabled{background:#9aa58f;cursor:not-allowed}
.done-text{font-size:1.05rem;margin:12px 0 4px}
.done-total{font-weight:800;color:var(--bark);font-variant-numeric:tabular-nums}

.field-hint{color:var(--muted);font-size:.82rem;margin:4px 0 0}
.done-code{font-family:var(--display);font-size:1.6rem;color:var(--leaf);margin:6px 0 0}
/* Acompanhar pedido */
.track{display:grid;gap:10px;margin-top:12px}
.tcard{background:#fff;border:2px solid var(--leaf);border-radius:16px;padding:12px 14px;box-shadow:0 4px 14px rgba(31,107,42,.12)}
.tcard.cancelado{border-color:var(--danger)}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.thead b{font-family:var(--display);font-size:1.15rem;color:var(--bark)}
.thead span{color:var(--muted);font-size:.85rem;font-weight:700}
.tstate{font-weight:800;color:var(--leaf);font-size:1.05rem;margin:4px 0 8px}
.tcard.cancelado .tstate{color:var(--danger)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;list-style:none;margin:0;padding:0}
.steps li{font-size:.72rem;font-weight:800;color:var(--muted);text-align:center;line-height:1.2}
.steps li::before{content:"";display:block;height:6px;border-radius:4px;background:var(--line);margin-bottom:5px}
.steps li.on{color:var(--leaf)}
.steps li.on::before{background:var(--lime)}
.steps li.now::before{background:var(--leaf)}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:.88rem}
.tfoot button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-weight:800;color:var(--bark)}
</style>
</head>
<body>
<template id="shell"><header class="top wrap">
  <div class="brand">
    <img data-img="logo" alt="Logo Suco Verde">
    <div>
      <h1>Suco Verde</h1>
      <span id="status" class="status open">Aberto agora</span>
      <span id="statusNote" class="status-note">Seg a sáb, das 6h às 12h30</span>
    </div>
  </div>
  <ul class="facts">
    <li>Entrega grátis dentro da Ceasa</li>
    <li>Retirada no balcão</li>
    <li>Pix, dinheiro, débito e crédito</li>
  </ul>
</header>

<section class="wrap track" id="track" hidden aria-live="polite"></section>

<nav class="cats" aria-label="Categorias"><div class="wrap" id="catNav"></div></nav>

<main class="wrap" id="menu"></main>

<footer class="foot wrap">
  Suco Verde · Ceasa · WhatsApp (86) 99999-3958<br>Segunda a sábado, das 6h às 12h30
</footer>

<div class="cartbar" id="cartbar" hidden>
  <button type="button" id="openCart"><span><span class="count" id="cartCount">0</span>Ver pedido</span><span id="cartTotal">R$ 0,00</span></button>
</div>

<!-- Ficha do item -->
<div class="veil" id="itemVeil" hidden>
  <form class="sheet" id="itemForm" role="dialog" aria-modal="true" aria-labelledby="itemTitle" novalidate>
    <div class="sheet-head">
      <div><h3 id="itemTitle"></h3><p class="sub" id="itemSub"></p></div>
      <button type="button" class="x" data-close aria-label="Fechar">×</button>
    </div>
    <div id="itemOpts"></div>
    <label class="lbl" for="itemObs">Observação <small style="font-weight:600;color:var(--muted)">(opcional)</small></label>
    <textarea id="itemObs" placeholder="Ex.: sem sal, bem passado..."></textarea>
    <p class="err" id="itemErr"></p>
    <div class="row-end">
      <div class="stepper">
        <button type="button" id="qMinus" aria-label="Diminuir quantidade">−</button>
        <output id="qVal">1</output>
        <button type="button" id="qPlus" aria-label="Aumentar quantidade">+</button>
      </div>
      <button type="submit" class="primary"><span>Adicionar</span><span id="itemTotal"></span></button>
    </div>
  </form>
</div>

<!-- Sacola -->
<div class="veil" id="cartVeil" hidden>
  <form class="sheet" id="cartForm" role="dialog" aria-modal="true" aria-labelledby="cartTitle" novalidate>
    <div class="sheet-head">
      <div><h3 id="cartTitle">Seu pedido</h3><p class="sub">Confira e envie</p></div>
      <button type="button" class="x" data-close aria-label="Fechar">×</button>
    </div>
    <ul class="lines" id="lines"></ul>
    <div class="totals"><span>Total<small id="freeNote">Entrega grátis na Ceasa</small></span><span id="sumTotal">R$ 0,00</span></div>

    <label class="lbl" for="cName">Seu nome</label>
    <input type="text" id="cName" autocomplete="name" placeholder="Como devemos te chamar?">
    <p class="err" id="eName"></p>

    <label class="lbl" for="cPhone">Seu WhatsApp</label>
    <input type="tel" id="cPhone" autocomplete="tel" inputmode="tel" placeholder="(86) 9 9999-9999">
    <p class="field-hint">Para avisarmos quando o pedido estiver pronto.</p>
    <p class="err" id="ePhone"></p>

    <fieldset>
      <legend>Como quer receber?</legend>
      <div class="seg">
        <label class="opt"><input type="radio" name="mode" value="entrega" checked><span>Entrega na Ceasa</span></label>
        <label class="opt"><input type="radio" name="mode" value="retirada"><span>Retirar no balcão</span></label>
      </div>
    </fieldset>
    <div id="placeBox">
      <label class="lbl" for="cPlace">Onde você está na Ceasa?</label>
      <input type="text" id="cPlace" placeholder="Ex.: Pavilhão B, box 12 – Banca do Zé">
      <p class="err" id="ePlace"></p>
    </div>

    <fieldset>
      <legend>Pagamento <small>(na entrega ou na retirada)</small></legend>
      <div class="seg four">
        <label class="opt"><input type="radio" name="pay" value="Pix"><span>Pix</span></label>
        <label class="opt"><input type="radio" name="pay" value="Dinheiro"><span>Dinheiro</span></label>
        <label class="opt"><input type="radio" name="pay" value="Cartão de débito"><span>Débito</span></label>
        <label class="opt"><input type="radio" name="pay" value="Cartão de crédito"><span>Crédito</span></label>
      </div>
      <p class="err" id="ePay"></p>
    </fieldset>
    <div id="changeBox" hidden>
      <label class="lbl" for="cChange">Troco para quanto? <small style="font-weight:600;color:var(--muted)">(deixe vazio se não precisar)</small></label>
      <input type="text" id="cChange" inputmode="decimal" placeholder="Ex.: 50">
      <p class="err" id="eChange"></p>
    </div>

    <label class="lbl" for="cObs">Observação geral <small style="font-weight:600;color:var(--muted)">(opcional)</small></label>
    <textarea id="cObs" placeholder="Algo mais que devemos saber?"></textarea>

    <div class="closed-box" id="closedBox" hidden></div>
    <div class="row-end">
      <button type="button" class="primary wa" id="sendOrder" style="justify-content:center">Enviar pedido</button>
    </div>
    <p class="hint">Seu pedido chega direto na Suco Verde.<br>Dúvidas: WhatsApp (86) 99999-3958</p>
  </form>
</div>


<!-- Pedido enviado -->
<div class="veil" id="doneVeil" hidden>
  <div class="sheet done" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
    <div class="sheet-head"><div><h3 id="doneTitle">Pedido enviado!</h3></div><button type="button" class="x" data-close aria-label="Fechar">×</button></div>
    <p id="doneText" class="done-text"></p>
    <p id="doneCode" class="done-code" hidden></p>
    <p id="doneTotal" class="done-total"></p>
    <div class="row-end"><a class="primary wa" id="doneWa" href="https://wa.me/5586999993958" target="_blank" rel="noopener" style="justify-content:center">Falar com a gente no WhatsApp</a></div>
    <div class="row-end" style="margin-top:8px"><button type="button" class="primary" data-close style="justify-content:center;background:var(--card);color:var(--leaf);border:2px solid var(--leaf)">Voltar ao cardápio</button></div>
  </div>
</div>

<script>(function(){
"use strict";
const WA = "5586999993958";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl = v => "R$ " + v.toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");

/* ---------- dados embutidos na página ---------- */
let DATA = JSON.parse($("menuData").textContent);
const IMG = JSON.parse($("imgData").textContent);
let MENU = DATA.cats;
let RECHEIOS = DATA.recheios;
const compCat = () => MENU.find(c=>c.id==="complementos");
const extrasList = () => (compCat()?compCat().itens:[]).map((it,k)=>({k,n:it.n,p:it.p,off:!!it.off}));

/* monta o esqueleto da página */
$("root").appendChild($("shell").content.cloneNode(true));
document.querySelectorAll("[data-img]").forEach(im=>{ if(IMG[im.dataset.img]) im.src=IMG[im.dataset.img]; });

const store = {
  get(k,d){try{const v=localStorage.getItem("sv_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("sv_"+k,JSON.stringify(v))}catch(e){}}
};

/* recupera a sacola salva e descarta o que saiu do cardápio */
function priceLine(l){
  const cat=MENU.find(c=>c.id===l.cid); const it=cat&&cat.itens[l.i];
  if(!it||it.n!==l.n||it.off) return null;
  const ex=extrasList(); let u=it.p;
  for(const name of (l.ex||[])){const e=ex.find(x=>x.n===name); if(!e||e.off) return null; u+=e.p;}
  return Object.assign({},l,{u, ex:l.ex||[]});
}
let cart = store.get("cart",[]);
cart = (Array.isArray(cart)?cart:[]).map(priceLine).filter(Boolean);

/* ---------- horário (fuso de Teresina) ---------- */
function nowTeresina(){
  const parts = new Intl.DateTimeFormat("en-US",{timeZone:"America/Fortaleza",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g = t => parts.find(p=>p.type===t).value;
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday"));
  return {wd, min: (parseInt(g("hour"),10)%24)*60 + parseInt(g("minute"),10)};
}
function inHours(){const {wd,min}=nowTeresina();return wd>=1 && wd<=6 && min>=360 && min<750}
function isOpen(){return inHours() && !DATA.pausado}
function nextOpenText(){
  const {wd,min}=nowTeresina();
  if(wd>=1 && wd<=6 && min<360) return "Abrimos hoje às 6h";
  if(wd===6 || wd===0) return "Abrimos segunda às 6h";
  return "Abrimos amanhã às 6h";
}
function renderStatus(){
  const s=$("status");
  if(DATA.pausado && inHours()){
    s.className="status closed"; s.textContent="Pedidos online pausados";
    $("statusNote").textContent="Fale com a gente pelo WhatsApp (86) 99999-3958";
  } else {
    const open=isOpen();
    s.className = "status " + (open?"open":"closed");
    s.textContent = open ? "Aberto agora" : "Fechado agora";
    $("statusNote").textContent = open ? "Seg a sáb, das 6h às 12h30" : nextOpenText() + " · seg a sáb, 6h às 12h30";
  }
  updateSend();
}

/* ---------- cardápio ---------- */
function qtyInCart(cid,i){return cart.filter(l=>l.cid===cid && l.i===i).reduce((a,l)=>a+l.q,0)}
function renderMenu(){
  $("catNav").innerHTML = MENU.map(c=>`<a href="#${c.id}" data-cat="${c.id}">${esc(c.nome)}</a>`).join("");
  $("menu").innerHTML = MENU.map(c=>`
   <section class="cat" id="${c.id}" aria-labelledby="h-${c.id}">
     ${c.foto&&IMG[c.foto]?`<img class="cat-photo" src="${IMG[c.foto]}" alt="" loading="lazy">`:""}
     <div class="cat-head"><div><h2 id="h-${c.id}">${esc(c.nome)}</h2>${c.sub?`<p>${esc(c.sub)}</p>`:""}</div></div>
     <div class="items">
      ${c.itens.map((it,i)=>{const q=qtyInCart(c.id,i);return `
       <button type="button" class="item${it.off?" off":""}" data-cid="${c.id}" data-i="${i}" ${it.off?'aria-disabled="true"':""}>
         <span><span class="nm">${esc(it.n)}${it.tag?`<span class="tag">${esc(it.tag)}</span>`:""}${it.off?`<span class="tag soldout">Esgotado</span>`:""}${q?`<span class="incart">${q} no pedido</span>`:""}</span>${it.d?`<span class="ds">${esc(it.d)}</span>`:""}</span>
         <span class="pr">${brl(it.p)}</span>
         <span class="add" aria-hidden="true">+</span>
       </button>`}).join("")}
     </div>
   </section>`).join("");
}
$("menu").addEventListener("click",e=>{
  const b=e.target.closest(".item"); if(!b||b.classList.contains("off")) return;
  openItem(b.dataset.cid, +b.dataset.i);
});
function trackCat(){
  let cur = MENU[0].id;
  for(const c of MENU){const el=$(c.id); if(el && el.getBoundingClientRect().top < 120) cur=c.id;}
  document.querySelectorAll("#catNav a").forEach(a=>{
    const on=a.dataset.cat===cur; a.classList.toggle("on",on);
    if(on && a.dataset.was!=="1"){a.scrollIntoView({block:"nearest",inline:"nearest"});}
    a.dataset.was = on?"1":"0";
  });
}
window.addEventListener("scroll",trackCat,{passive:true});

/* ---------- ficha do item ---------- */
let cur=null, qty=1, lastFocus=null;
function openItem(cid,i){
  const cat=MENU.find(c=>c.id===cid), it=cat.itens[i];
  cur={cid,i,it}; qty=1;
  $("itemTitle").textContent=it.n;
  $("itemSub").textContent=(it.d?it.d+" · ":"")+brl(it.p);
  const o=it.o||[]; let h="";
  if(o.includes("pick2")) h+=`<fieldset><legend>Escolha 2 recheios <small>(obrigatório)</small></legend><div class="opts">${RECHEIOS.map((r,k)=>`<label class="opt"><input type="checkbox" name="pick2" value="${esc(r)}" id="pk${k}"><span>${esc(r)}</span></label>`).join("")}</div></fieldset>`;
  if(o.includes("sabor")) h+=`<fieldset><legend>Sabor <small>(obrigatório)</small></legend><div class="opts">${DATA.sabores.map((s,k)=>`<label class="opt"><input type="radio" name="sabor" value="${esc(s.n)}" id="sb${k}" ${s.off?"disabled":""}><span>${esc(s.n)}</span>${s.off?'<span class="ep">Esgotado</span>':""}</label>`).join("")}</div></fieldset>`;
  if(o.includes("extras")){
    const ex=extrasList().filter(e=>!e.off);
    if(ex.length) h+=`<fieldset><legend>Complementos <small>(opcional)</small></legend><div class="opts">${ex.map(e=>`<label class="opt"><input type="checkbox" name="extra" value="${e.k}" id="ex${e.k}"><span>${esc(e.n)}</span><span class="ep">+ ${brl(e.p)}</span></label>`).join("")}</div></fieldset>`;
  }
  $("itemOpts").innerHTML=h;
  $("itemObs").value=""; $("itemObs").placeholder=it.ph||"Ex.: sem sal, bem passado...";
  $("itemErr").textContent="";
  updItem();
  show("itemVeil");
}
function chosenExtras(){return [...document.querySelectorAll('#itemOpts input[name=extra]:checked')].map(x=>compCat().itens[+x.value])}
function itemUnit(){return cur.it.p + chosenExtras().reduce((a,e)=>a+e.p,0)}
function updItem(){
  $("qVal").textContent=qty;
  $("itemTotal").textContent=brl(itemUnit()*qty);
  const picks=[...document.querySelectorAll('#itemOpts input[name=pick2]')];
  const n=picks.filter(x=>x.checked).length;
  picks.forEach(x=>{x.disabled = !x.checked && n>=2});
}
$("itemOpts").addEventListener("change",()=>{ $("itemErr").textContent=""; updItem(); });
$("qMinus").onclick=()=>{if(qty>1){qty--;updItem()}};
$("qPlus").onclick=()=>{if(qty<99){qty++;updItem()}};
$("itemForm").addEventListener("submit",e=>{
  e.preventDefault();
  const o=cur.it.o||[], det=[];
  if(o.includes("pick2")){
    const p=[...document.querySelectorAll('#itemOpts input[name=pick2]:checked')].map(x=>x.value);
    if(p.length!==2){$("itemErr").textContent="Escolha 2 recheios para continuar.";return}
    det.push(p.join(" e "));
  }
  if(o.includes("sabor")){
    const s=document.querySelector('#itemOpts input[name=sabor]:checked');
    if(!s){$("itemErr").textContent="Escolha o sabor do suco.";return}
    det.push(s.value);
  }
  const ex=chosenExtras().map(x=>x.n);
  const obs=$("itemObs").value.trim();
  const line={cid:cur.cid,i:cur.i,n:cur.it.n,u:itemUnit(),q:qty,det:det.join(", "),ex,obs};
  const same=cart.find(l=>l.cid===line.cid&&l.i===line.i&&l.det===line.det&&l.obs===line.obs&&l.ex.join()===line.ex.join());
  if(same) same.q+=qty; else cart.push(line);
  save(); hide("itemVeil"); renderMenu(); trackCat();
});

/* ---------- sacola ---------- */
const total=()=>cart.reduce((a,l)=>a+l.u*l.q,0);
function save(){store.set("cart",cart);renderBar()}
function renderBar(){
  const n=cart.reduce((a,l)=>a+l.q,0);
  $("cartbar").hidden=n===0;
  $("cartCount").textContent=n;
  $("cartTotal").textContent=brl(total());
}
function renderCart(){
  if(!cart.length){$("lines").innerHTML=`<li class="empty">Seu pedido está vazio.</li>`;}
  else $("lines").innerHTML=cart.map((l,k)=>`
   <li class="line">
     <span class="nm">${l.q}× ${esc(l.n)}</span><span class="pr">${brl(l.u*l.q)}</span>
     ${(l.det||l.ex.length||l.obs)?`<span class="det">${[l.det, l.ex.length?"+ "+l.ex.join(", + "):"", l.obs?"Obs.: "+l.obs:""].filter(Boolean).map(esc).join("<br>")}</span>`:""}
     <span class="ctl">
       <button type="button" data-k="${k}" data-a="-1" aria-label="Diminuir ${esc(l.n)}">−</button>
       <button type="button" data-k="${k}" data-a="1" aria-label="Aumentar ${esc(l.n)}">+</button>
       <button type="button" class="rm" data-k="${k}" data-a="rm">Remover</button>
     </span>
   </li>`).join("");
  $("sumTotal").textContent=brl(total());
  updateSend();
}
$("lines").addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]"); if(!b) return;
  const k=+b.dataset.k, a=b.dataset.a;
  if(a==="rm") cart.splice(k,1);
  else{cart[k].q+= +a; if(cart[k].q<1) cart.splice(k,1);}
  save(); renderCart(); renderMenu();
  if(!cart.length) hide("cartVeil");
});
$("openCart").onclick=()=>{renderCart();show("cartVeil")};

const cust=store.get("cust",{});
if(cust.name) $("cName").value=cust.name;
if(cust.place) $("cPlace").value=cust.place;
if(cust.phone) $("cPhone").value=cust.phone;
if(cust.mode){const r=document.querySelector(`input[name=mode][value="${cust.mode}"]`); if(r) r.checked=true;}

const mode=()=>document.querySelector("input[name=mode]:checked").value;
const pay=()=>{const r=document.querySelector("input[name=pay]:checked");return r?r.value:""};
function syncForm(){
  $("placeBox").hidden = mode()!=="entrega";
  $("freeNote").textContent = mode()==="entrega" ? "Entrega grátis na Ceasa" : "Retirada no balcão";
  $("changeBox").hidden = pay()!=="Dinheiro";
  ["eName","ePhone","ePlace","ePay","eChange"].forEach(id=>{$(id).textContent=""});
  updateSend();
}
$("cartForm").addEventListener("change",syncForm);
$("cartForm").addEventListener("input",updateSend);
$("cartForm").addEventListener("submit",e=>e.preventDefault());

function parseMoney(s){s=s.replace(/[^\d,\.]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".");return s?parseFloat(s):NaN}

function buildMessage(){
  const name=$("cName").value.trim(), m=mode(), p=pay();
  const L=["*Pedido – Suco Verde*","","*Cliente:* "+name]; if(phoneDigits()) L.push("*WhatsApp:* "+fmtPhone(phoneDigits())); L.push("");
  cart.forEach(l=>{
    L.push(`${l.q}x ${l.n} – ${brl(l.u*l.q)}`);
    if(l.det) L.push("   • "+l.det);
    l.ex.forEach(x=>L.push("   + "+x));
    if(l.obs) L.push("   Obs.: "+l.obs);
  });
  L.push("","*Total: "+brl(total())+"*","");
  if(m==="entrega") L.push("*Entrega na Ceasa* (grátis)","Local: "+$("cPlace").value.trim());
  else L.push("*Retirada no balcão*");
  let pg="*Pagamento:* "+p;
  if(p==="Dinheiro"){const t=parseMoney($("cChange").value); pg+= isNaN(t)?" (sem troco)":" – troco para "+brl(t);}
  L.push(pg);
  const obs=$("cObs").value.trim(); if(obs) L.push("","*Obs.:* "+obs);
  return L.join("\n");
}
function updateSend(){
  const a=$("sendOrder"), open=isOpen();
  $("closedBox").hidden=open;
  if(!open) $("closedBox").textContent = (DATA.pausado && inHours())
    ? "Os pedidos pelo site estão pausados agora. Chame a gente direto no WhatsApp: (86) 99999-3958."
    : "Estamos fechados agora. "+nextOpenText()+". Você pode montar o pedido e enviar quando abrirmos.";
  if(!sending) a.disabled = !open||!cart.length;
}
function tzDate(d){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Fortaleza",year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
const r2=v=>Math.round(v*100)/100;
function orderDoc(){
  const p=pay(), d={origem:"site",status:"novo",dia:tzDate(new Date()),cliente:$("cName").value.trim().slice(0,80),
    modo:mode(),pagamento:p,total:r2(total()),
    itens:cart.map(l=>({q:l.q,n:l.n,v:r2(l.u*l.q),det:l.det?[l.det]:[],ex:l.ex||[],obs:l.obs||""}))};
  if(phoneDigits()) d.telefone=phoneDigits();
  if(mode()==="entrega") d.local=$("cPlace").value.trim().slice(0,200);
  const obs=$("cObs").value.trim(); if(obs) d.obs=obs.slice(0,500);
  if(p==="Dinheiro"){const t=parseMoney($("cChange").value); if(!isNaN(t)) d.troco=brl(t);}
  return d;
}
let sending=false;
$("sendOrder").addEventListener("click",async()=>{
  if(sending) return;
  if(!isOpen()||!cart.length){renderStatus();return}
  let ok=true;
  const name=$("cName").value.trim();
  if(!name){$("eName").textContent="Informe seu nome.";ok=false}
  const ph=phoneDigits();
  if(!ph){$("ePhone").textContent="Informe seu WhatsApp com DDD, para avisarmos quando ficar pronto.";ok=false}
  else if(ph.length<10||ph.length>11){$("ePhone").textContent="Confira o número: use DDD + número, como (86) 9 9999-9999.";ok=false}
  if(mode()==="entrega" && !$("cPlace").value.trim()){$("ePlace").textContent="Diga onde entregar: pavilhão, box ou nome da banca.";ok=false}
  if(!pay()){$("ePay").textContent="Escolha a forma de pagamento.";ok=false}
  if(pay()==="Dinheiro"){
    const raw=$("cChange").value.trim(), t=parseMoney(raw);
    if(raw && (isNaN(t)||t<total())){$("eChange").textContent="O valor do troco precisa ser maior que o total ("+brl(total())+").";ok=false}
  }
  if(!ok){const f=document.querySelector("#cartForm .err:not(:empty)");if(f)f.scrollIntoView({block:"center",behavior:"smooth"});return}
  store.set("cust",{name,phone:$("cPhone").value.trim(),place:$("cPlace").value.trim(),mode:mode()});
  const msg=buildMessage(), doc=orderDoc(), btn=$("sendOrder");
  sending=true; btn.disabled=true; btn.textContent="Enviando pedido...";
  let sent=false, newId=null;
  try{
    const be=await backend();
    newId=await Promise.race([be.createOrder(doc), new Promise((_,rej)=>setTimeout(()=>rej(new Error("tempo")),15000))]);
    sent=true;
  }catch(err){ console.warn("pedido não salvo", err); }
  sending=false; btn.textContent="Enviar pedido";
  const wa="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
  if(sent){
    cart=[]; save(); renderMenu(); hide("cartVeil");
    $("doneTitle").textContent="Pedido enviado!";
    $("doneText").textContent = doc.modo==="entrega" ? "A Suco Verde já recebeu seu pedido e vai levar até você na Ceasa." : "A Suco Verde já recebeu seu pedido. É só retirar no balcão.";
    $("doneTotal").textContent="Total: "+brl(doc.total)+" · "+doc.pagamento;
    const code=codeOf(newId);
    $("doneCode").hidden=false; $("doneCode").textContent="Pedido #"+code;
    $("doneText").textContent += " Você acompanha o andamento no topo desta página.";
    $("doneWa").textContent="Falar com a gente no WhatsApp";
    $("doneWa").href="https://wa.me/"+WA+"?text="+encodeURIComponent("Olá! Acabei de fazer o pedido #"+code+" pelo site, em nome de "+doc.cliente+".");
    addTrack(newId);
  } else {
    hide("cartVeil");
    $("doneCode").hidden=true;
    $("doneTitle").textContent="Falta só um passo";
    $("doneText").textContent="Não conseguimos registrar seu pedido pelo site agora. Toque no botão abaixo para enviar o mesmo pedido pelo WhatsApp.";
    $("doneTotal").textContent="Total: "+brl(doc.total);
    $("doneWa").textContent="Enviar pedido pelo WhatsApp";
    $("doneWa").href=wa;
    $("doneWa").onclick=()=>{setTimeout(()=>{cart=[];save();renderMenu();renderBar()},800)};
  }
  updateSend(); show("doneVeil");
});

/* ---------- WhatsApp do cliente ---------- */
function phoneDigits(){let d=$("cPhone").value.replace(/\D/g,""); if(d.length>11&&d.startsWith("55")) d=d.slice(2); return d.slice(0,11)}
function fmtPhone(d){return d.length===11?"("+d.slice(0,2)+") "+d.slice(2,3)+" "+d.slice(3,7)+"-"+d.slice(7):d.length===10?"("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6):d}
const codeOf=id=>String(id||"").slice(0,4).toUpperCase();

/* ---------- acompanhar pedido ---------- */
const TRACK_KEY="track";
let tracks=store.get(TRACK_KEY,[]); if(!Array.isArray(tracks)) tracks=[];
const watchers={}, tState={};
const TXT={novo:"Recebido! Já vamos começar.",preparo:"Em preparo",pronto_entrega:"Saiu para entrega",pronto_retirada:"Pronto! Pode retirar no balcão",entregue:"Entregue. Bom apetite!",cancelado:"Pedido cancelado. Fale com a gente no WhatsApp."};
function addTrack(id){
  if(!id) return;
  if(!tracks.some(t=>t.id===id)) tracks.unshift({id,ts:Date.now()});
  tracks=tracks.slice(0,5); store.set(TRACK_KEY,tracks); watchTracks();
}
function dropTrack(id){
  tracks=tracks.filter(t=>t.id!==id); store.set(TRACK_KEY,tracks);
  if(watchers[id]){watchers[id]();delete watchers[id]} delete tState[id]; renderTrack();
}
function watchTracks(){
  const dayAgo=Date.now()-20*3600e3;
  tracks=tracks.filter(t=>t.ts>dayAgo); store.set(TRACK_KEY,tracks);
  backend().then(be=>{
    tracks.forEach(t=>{
      if(watchers[t.id]) return;
      watchers[t.id]=be.watchOrder(t.id,d=>{ if(!d){dropTrack(t.id);return} tState[t.id]=d; renderTrack(); },()=>{});
    });
  }).catch(()=>{});
  renderTrack();
}
function renderTrack(){
  const box=$("track"), list=tracks.filter(t=>tState[t.id]);
  box.hidden=!list.length;
  box.innerHTML=list.map(t=>{
    const d=tState[t.id], st=d.status, ent=d.modo==="entrega";
    const key=st==="pronto"?(ent?"pronto_entrega":"pronto_retirada"):st;
    const steps=["Recebido","Em preparo",ent?"Saiu para entrega":"Pronto",ent?"Entregue":"Retirado"];
    const idx={novo:0,preparo:1,pronto:2,entregue:3}[st];
    const done=st==="entregue"||st==="cancelado";
    return `<article class="tcard ${esc(st)}">
      <div class="thead"><b>Seu pedido #${esc(codeOf(t.id))}</b><span>${brl(+d.total||0)}</span></div>
      <div class="tstate">${esc(TXT[key]||st)}</div>
      ${st!=="cancelado"?`<ol class="steps">${steps.map((s,i)=>`<li class="${i<=idx?"on":""}${i===idx?" now":""}">${s}</li>`).join("")}</ol>`:""}
      <div class="tfoot"><span>${esc((d.itens||[]).map(i=>i.q+"× "+i.n).join(", "))}</span>${done?`<button type="button" data-untrack="${esc(t.id)}">Ok</button>`:""}</div>
    </article>`;
  }).join("");
}
$("track").addEventListener("click",e=>{const b=e.target.closest("[data-untrack]"); if(b) dropTrack(b.dataset.untrack)});

/* ---------- Firebase ---------- */
const FB_V="12.19.0";
const FB_CFG={"apiKey":"AIzaSyDOdi8WnCynNGPQi0s08ob5QJl9W3CGHqc","authDomain":"suco-verde.firebaseapp.com","projectId":"suco-verde","storageBucket":"suco-verde.firebasestorage.app","messagingSenderId":"345198016751","appId":"1:345198016751:web:343425cca053bee91bc31a"};
let beP=null;
function backend(){
  if(window.__MOCK_BACKEND) return Promise.resolve(window.__MOCK_BACKEND);
  if(!beP) beP=(async()=>{
    const [A,F]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/"+FB_V+"/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/"+FB_V+"/firebase-firestore.js")]);
    const db=F.getFirestore(A.initializeApp(FB_CFG));
    return {
      watchMenu(cb){return F.onSnapshot(F.doc(db,"config","cardapio"),s=>{if(s.exists())cb(s.data())},e=>console.warn(e))},
      watchOrder(id,cb,err){return F.onSnapshot(F.doc(db,"pedidos",id),s=>cb(s.exists()?s.data():null),err)},
      async createOrder(d){const ref=F.doc(F.collection(db,"pedidos")); await F.setDoc(ref,Object.assign({},d,{criado:F.serverTimestamp()})); return ref.id;}
    };
  })();
  return beP;
}
function applyMenu(d){
  if(!d||!Array.isArray(d.cats)||!d.cats.length) return;
  DATA=d; MENU=d.cats; RECHEIOS=d.recheios||RECHEIOS; if(!Array.isArray(DATA.sabores)) DATA.sabores=[];
  cart=cart.map(priceLine).filter(Boolean); save();
  renderMenu(); trackCat(); renderStatus();
  if(!$("cartVeil").hidden) renderCart();
}
backend().then(be=>be.watchMenu(applyMenu)).catch(e=>console.warn("cardápio ao vivo indisponível",e));
(function(){const m=location.hash.match(/^#pedido-([A-Za-z0-9]{10,40})$/); if(m) addTrack(m[1]); else watchTracks();})();

/* ---------- folhas ---------- */
function show(id){lastFocus=document.activeElement;$(id).hidden=false;document.body.style.overflow="hidden";const f=$(id).querySelector("button,input,textarea");if(f)f.focus({preventScroll:true})}
function hide(id){$(id).hidden=true;document.body.style.overflow="";if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});if(id==="doneVeil"&&!$("track").hidden)window.scrollTo({top:0,behavior:"smooth"})}
document.addEventListener("click",e=>{
  const v=e.target.classList&&e.target.classList.contains("veil")?e.target:null;
  if(v) return hide(v.id);
  const c=e.target.closest&&e.target.closest("[data-close]");
  if(c) hide(c.closest(".veil").id);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".veil:not([hidden])").forEach(v=>hide(v.id))});

renderMenu(); renderBar(); syncForm(); renderStatus(); trackCat();
setInterval(renderStatus,60000);
})();
</script>
