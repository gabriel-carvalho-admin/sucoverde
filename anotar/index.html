<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f6b2a">
<title>Anotar pedido · Suco Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: painel de balcão para celular ou tablet; resumo do dia no topo, ações grandes, fila de pedidos por status, resumo de vendas no fim. Mesmas cores do site. */
:root{
  --leaf:#1f6b2a; --lime:#6cad2f; --bark:#6b3a1e; --sun:#e8821e;
  --paper:#fbf4e6; --card:#fffaf1; --ink:#2b2118; --muted:#7a6a58; --line:#ead9bd; --danger:#b3261e;
  --s-novo:#e8821e; --s-preparo:#2f6fb3; --s-pronto:#6cad2f; --s-entregue:#7a6a58; --s-cancelado:#b3261e;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{padding:16px 0 6px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
h1{font-family:var(--display);color:var(--bark);font-size:1.6rem;margin:0;line-height:1}
h1 small{display:block;font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:700;margin-top:4px}
.day{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.day input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--bark);font-weight:800;border-radius:10px;padding:8px 12px}
.btn.solid{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.big{padding:14px 16px;font-size:1rem;border-radius:14px}
.btn.warn{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{background:#fdf0dc;border:1px solid #f1d3a6;color:#7a4b10;border-radius:12px;padding:10px 12px;font-weight:700;margin:10px 0}
.note[hidden]{display:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile span{display:block;color:var(--muted);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.tile b{font-family:var(--display);font-size:1.5rem;color:var(--bark);font-variant-numeric:tabular-nums;line-height:1.2}
.tile.hot b{color:var(--s-novo)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--leaf);background:var(--card);color:var(--leaf);font-weight:800;border-radius:999px;padding:5px 12px;font-size:.88rem}
.chip[aria-pressed=true]{background:var(--leaf);color:#fff}
.chip .n{font-variant-numeric:tabular-nums;opacity:.8;margin-left:4px}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin:12px 0 4px}
.order{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--st);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.order .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.order .num{font-family:var(--display);font-size:1.25rem;color:var(--bark);font-weight:800}
.order .meta{color:var(--muted);font-size:.85rem;font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:800;color:#fff;background:var(--st)}
.order .who{font-weight:800}
.order .where{font-size:.9rem;color:var(--bark);font-weight:700}
.order ul{list-style:none;margin:0;padding:0;font-size:.92rem;display:grid;gap:3px}
.order li small{display:block;color:var(--muted);padding-left:14px}
.order .obs{background:#fdf0dc;border-radius:8px;padding:6px 8px;font-size:.88rem}
.order .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:8px;font-weight:800;font-variant-numeric:tabular-nums}
.order .foot small{color:var(--muted);font-weight:700}
.order .btns{display:flex;gap:6px;flex-wrap:wrap}
.order .btns .btn.solid{flex:1}
.st-novo{--st:var(--s-novo)} .st-preparo{--st:var(--s-preparo)} .st-pronto{--st:var(--s-pronto)} .st-entregue{--st:var(--s-entregue)} .st-cancelado{--st:var(--s-cancelado)}
.st-entregue,.st-cancelado{opacity:.8}
.empty{color:var(--muted);text-align:center;padding:30px 0;grid-column:1/-1}
h2{font-family:var(--display);color:var(--bark);font-size:1.3rem;margin:24px 0 8px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:900px){.summary{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.summary{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.box h3{margin:0 0 8px;font-size:1rem;color:var(--bark)}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}
.bar i{display:block;height:10px;border-radius:6px;background:var(--lime)}
.bar .t{background:#efe3cf;border-radius:6px}
.bar b{font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:.82rem;text-align:center;margin:30px 0 20px}
/* folhas */
.veil{position:fixed;inset:0;z-index:20;background:rgba(43,33,24,.5);display:flex;align-items:flex-end;justify-content:center}
.veil[hidden]{display:none}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 20px}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:22px}}
.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet h3{font-family:var(--display);color:var(--bark);font-size:1.35rem;margin:0}
.sheet .sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.x{border:0;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:1.3rem;color:var(--bark);flex:none}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:170px;resize:vertical}
label.lbl{display:block;font-weight:800;color:var(--bark);margin:14px 0 6px}
.err{color:var(--danger);font-weight:700;font-size:.9rem;margin:8px 0 0}
.err:empty{display:none}
.preview{margin-top:12px}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{flex:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-weight:700;cursor:pointer}
.seg label:has(input:checked){border-color:var(--leaf);background:#eef6e6;color:var(--leaf)}
.seg input{accent-color:var(--leaf)}
.pick-cat{font-weight:800;color:var(--bark);margin:12px 0 6px;font-size:.92rem}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-weight:700;font-size:.88rem;text-align:left}
.pick button span{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.bl-lines{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.bl-lines li{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.bl-lines li input{grid-column:1/-1;padding:6px 8px;font-size:.88rem}
.bl-lines .q{display:flex;gap:4px;align-items:center}
.bl-lines .q button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;font-weight:800;color:var(--leaf)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;margin-top:10px;font-variant-numeric:tabular-nums}

.order .num .code{font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:800;margin-left:6px;letter-spacing:.04em}
.order .tel{font-weight:700;color:var(--muted);font-size:.88rem}
.order .btns2{display:flex;gap:6px;flex-wrap:wrap}
.order .btns2 .btn{flex:1;text-align:center;text-decoration:none;font-size:.88rem}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
@media (prefers-reduced-motion:no-preference){.btn.pulse{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(31,168,85,.25)}}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none !important}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
.login h1{margin-bottom:6px}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin-top:12px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:8px 0 6px}
.tabs button{border:0;background:transparent;font-weight:800;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--leaf);border-bottom-color:var(--leaf)}
.note.sound{cursor:pointer;background:#e6f0fb;border-color:#bcd3ee;color:#1f4f86}
.pick button.soldout{opacity:.5;text-decoration:line-through}
.ad-cat{font-family:var(--display);color:var(--bark);font-size:1.1rem;margin:20px 0 8px}
.ad-list{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ad-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ad-row.switch{margin-top:14px;cursor:pointer}
.ad-row.switch input{width:20px;height:20px;accent-color:var(--leaf)}
.ad-row.switch small{color:var(--muted);font-weight:600}
.ad-row.is-off{background:#f1e9dc}
.ad-row.is-off .ad-av span{text-decoration:line-through;color:var(--muted)}
.ad-av{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-weight:700;cursor:pointer}
.ad-av input{width:20px;height:20px;accent-color:var(--leaf);flex:none}
.ad-pr{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--muted);flex:none}
.ad-pr input{width:84px !important;padding:6px 8px !important;text-align:right;font-variant-numeric:tabular-nums}
.ad-pr input.bad{border-color:var(--danger);background:#fdecea}
.ad-foot{position:sticky;bottom:0;background:var(--paper);padding:10px 0 14px;margin-top:14px;border-top:1px solid var(--line)}

.autowa{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--bark);font-size:.9rem;margin:0 0 10px;cursor:pointer}
.autowa input{width:18px;height:18px;accent-color:var(--leaf)}
.ad-cathead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}
.ad-cathead .ad-cat{margin:0 0 6px}
.ad-cbtns{display:flex;gap:6px;margin-bottom:6px}
.ad-cbtns .btn{font-size:.85rem;padding:6px 10px}
.ad-row .x{width:30px;height:30px;font-size:1rem;flex:none}
.btn.sm{padding:4px 8px;font-size:.8rem}
.ad-row.is-new{border-color:var(--lime);background:#f4f9ee}
.newtag{background:var(--lime);color:#fff;border-radius:6px;padding:0 6px;font-size:.7rem;font-weight:800}
.ad-d{display:block;color:var(--muted);font-weight:600;font-size:.78rem}
.ad-form{background:#fff;border:2px solid var(--lime);border-radius:14px;padding:12px;margin:8px 0}
.ad-form h4{margin:0 0 8px;color:var(--leaf)}
.ad-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.ad-grid label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.88rem;color:var(--bark)}
.ad-grid label small{color:var(--muted);font-weight:600}
.ad-grid .wide{grid-column:1/-1}
.ad-grid select{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
@media (max-width:560px){.ad-grid{grid-template-columns:1fr}}
.ad-opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-weight:700;font-size:.88rem}
.ad-opts input{accent-color:var(--leaf);width:18px;height:18px;vertical-align:-3px}
.ad-newcat{margin-top:16px}
.ad-addsb{display:flex;gap:8px;margin-top:8px}
.ad-addsb input{flex:1}
body{padding-bottom:0}
.ctop{background:var(--card);border-bottom:3px solid var(--lime);box-shadow:0 2px 10px rgba(107,58,30,.08)}
.ctop-in{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px}
.clogo{width:68px;height:auto;border-radius:14px}
.ctitle{flex:1;min-width:0}
.ctitle h1{font-family:var(--display);color:var(--bark);font-size:1.5rem;margin:0;line-height:1;white-space:nowrap}
.ctitle p{margin:4px 0 0;color:var(--leaf);font-weight:700;font-size:.9rem}
.cnav{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.cnav a{color:var(--leaf);font-weight:800;font-size:.85rem;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:#fff}
main.wrap{max-width:640px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.card h2{font-family:var(--body);font-weight:800;font-size:1rem;letter-spacing:.04em;text-transform:uppercase;color:var(--leaf);margin:0 0 10px}
.lbl small{font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=password],select{width:100%;font:inherit;font-size:1rem;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stores button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;font-weight:800;font-size:1rem;color:var(--bark)}
.stores button.avulsa{grid-column:1/-1;border-style:dashed}
.stores button[aria-checked=true]{border-color:var(--leaf);border-style:solid;background:var(--leaf);color:#fff}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;align-items:center}
.recent .rl{font-size:.8rem;font-weight:800;color:var(--muted);width:100%}
.recent button{border:1px solid var(--line);background:#eef6e6;color:var(--leaf);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(43,33,24,.15);list-style:none;margin:0;padding:4px;max-height:min(300px,45vh);overflow:auto}
.ac-list li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:11px 10px;border-radius:8px;cursor:pointer;font-weight:700}
.ac-list li small{color:var(--muted);font-weight:600;font-size:.8rem;white-space:nowrap}
.ac-list li[aria-selected=true]{background:#eef6e6}
.ac-list li.new{color:var(--leaf)}
.ac-list mark{background:#fde8cf;color:inherit;border-radius:3px}
.last{margin-top:8px;background:#f4f9ee;border:1px solid #d5e8c4;border-radius:10px;padding:8px 10px;font-size:.88rem;color:#2c4a1c}
.stepper2{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.stepper2 button{border:0;background:var(--card);width:48px;font-size:1.4rem;font-weight:800;color:var(--leaf)}
.stepper2 input{border:0 !important;border-radius:0 !important;text-align:center;min-width:0}
.money{display:flex;gap:8px}
.money input{flex:1}
.money .btn{white-space:nowrap;font-size:.85rem}
.calc{margin:8px 0 0;color:var(--muted);font-weight:700;font-size:.88rem;min-height:1.2em}
.calc .up{color:var(--danger)} .calc .down{color:var(--leaf)}
.btn.gold{background:#d8a32b;border-color:#d8a32b;color:#2b2118}
.items,.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.items li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.items .brand{color:var(--muted);font-weight:600;font-size:.88rem}
.items small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.it-t{font-variant-numeric:tabular-nums;white-space:nowrap}
.it-act,.h-act{grid-column:1/-1;display:flex;gap:6px}
.it-act button,.h-act button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:.82rem;color:var(--bark)}
button.rm{color:var(--danger)}
.items li.empty,.hist li.empty{display:block;text-align:center;color:var(--muted);border:0;background:none;padding:14px}
.hist li{border-bottom:1px solid var(--line);padding:8px 0 10px}
.h-top{display:flex;gap:8px;align-items:baseline}
.h-top span{color:var(--muted);font-size:.85rem;font-weight:700}
.h-t{margin-left:auto;font-variant-numeric:tabular-nums}
.hist small{display:block;color:var(--muted);font-size:.82rem;margin:2px 0 6px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(43,33,24,.08);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.savebar-in{max-width:640px;display:grid;gap:8px}
.savebar .sum{display:flex;justify-content:space-between;align-items:baseline}
.savebar .sum span{color:var(--muted);font-weight:700}
.savebar .sum b{font-family:var(--display);font-size:1.6rem;color:var(--leaf);font-variant-numeric:tabular-nums}
.savebar .btn:disabled{background:#9aa58f;border-color:#9aa58f}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;z-index:30;background:var(--ink);color:#fff;font-weight:700;border-radius:999px;padding:10px 18px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:90%;text-align:center}
.login{margin-top:30px}
.login h2{font-family:var(--display);color:var(--bark);margin:0 0 6px}
.catchip{display:inline-block;margin-left:6px;background:#eef6e6;color:var(--leaf);font-size:.72rem;font-weight:800;border-radius:6px;padding:1px 7px;vertical-align:2px}
.newcat{margin-top:4px;background:#f4f9ee;border:1px solid #d5e8c4;border-radius:12px;padding:4px 10px 10px}
select:disabled{opacity:.6}

.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modes button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px;justify-content:center}
.modes button b{font-size:1rem}
.modes button small{font-size:.72rem;color:var(--muted);font-weight:600;line-height:1.15;text-align:center}
.modes button[aria-checked=true]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.modes button[aria-checked=true] small{color:#dcefd0}
.mbox{margin-top:10px;padding:12px;border-radius:14px;background:#f8f4ec;border:1px solid var(--line)}
.mbox>.lbl:first-child{margin-top:0}
.amt{display:flex;gap:8px;align-items:stretch;margin-top:6px}
.amt input{flex:1;min-width:0;font-size:1.15rem !important;font-weight:800;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex:none}
.seg button{border:0;background:#fff;padding:0 13px;font-weight:800;font-size:.98rem;color:var(--ink);min-width:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked=true]{background:var(--leaf);color:#fff}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick:empty{display:none}
.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;color:var(--bark)}
.quick.tipos{margin:6px 0 4px}
.quick.tipos button[aria-pressed=true]{background:var(--bark);border-color:var(--bark);color:#fff}
#boxEmb+#boxQty{margin-top:6px}
.mbox .stepper2{margin-top:6px}
.stepper2 input{font-size:1.15rem !important;font-weight:800}
.resumo{margin:10px 0 0;font-size:.92rem;color:var(--leaf)}
@media (max-width:420px){.modes{grid-template-columns:repeat(2,1fr)}.modes button{flex-direction:row;gap:6px;min-height:48px}.seg button{padding:0 9px;min-width:36px;font-size:.9rem}}
p.lbl{display:block;font-weight:800;color:var(--bark);margin:14px 0 6px;font-size:inherit}

.rev h2 .bdg{background:#eb6834;color:#fff;border-radius:999px;font-size:.75rem;padding:1px 8px;vertical-align:middle;letter-spacing:0}
.revall{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.88rem;color:var(--muted);margin:6px 0 4px}
.rv{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff;overflow:hidden}
.rv.bad{border-color:#f1c79f}
.rv-h{width:100%;text-align:left;border:0;background:none;padding:11px 12px;display:block;font:inherit;color:var(--ink);cursor:pointer}
.rv.bad .rv-h{background:#fdf3e6}
.rv-h b{display:block}
.rv-h small{display:block;color:var(--muted);font-weight:600;font-size:.8rem;margin-top:2px}
.rv.bad .rv-h small{color:#b4541b}
.rv-b{padding:4px 12px 12px}
.rv-tip{font-size:.88rem;background:#eef6e6;border-radius:10px;padding:8px 10px;margin:8px 0}
.rv-tip .btn{margin-top:6px}
.rv-bulk{background:#f8f4ec;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;display:grid;gap:6px;font-size:.88rem;font-weight:700}
.rv-bulk select{width:auto;padding:8px !important;border-radius:10px}
.rv-l{list-style:none;margin:6px 0 0;padding:0}
.rv-l li{border-top:1px solid var(--line);padding:9px 0}
.rv-r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.rv-r span{font-size:.78rem;color:var(--muted);font-weight:700}
.rv-r b{grid-column:1;font-size:.95rem}
.rv-r em{grid-column:1;font-style:normal;font-size:.85rem;font-weight:700}
.rv-r em small{display:inline;color:var(--muted);font-weight:600;margin-left:6px}
.rv-r .btn{grid-column:2;grid-row:1/4}
.rv-l li.p .rv-r b{color:#b4541b}
.rv-p{margin:4px 0 0;font-size:.8rem;color:#b4541b;font-weight:700}
.rv-e{margin-top:8px;background:#f8f4ec;border-radius:10px;padding:10px;display:grid;gap:8px}
.rv-e .amt{margin:0;align-items:center}
.rv-e select{width:auto;padding:8px !important;border-radius:10px}
.rv-un{font-weight:800;color:var(--muted);font-size:.88rem;white-space:nowrap}
.modes.sm{grid-template-columns:repeat(4,1fr)}
.modes.sm button{min-height:38px;padding:6px 2px;flex-direction:row}
.modes.sm button b{font-size:.85rem}
.rv-prev{margin:0;font-size:.88rem;color:var(--leaf)}
.btn.sm{padding:7px 12px;font-size:.85rem}
@media (max-width:420px){.modes.sm{grid-template-columns:repeat(4,1fr)}.modes.sm button{min-height:38px}}
.revtop{display:block;margin:12px 0 0;background:#fdf3e6;border:1px solid #f1c79f;border-radius:12px;padding:10px 12px;font-weight:800;color:#b4541b;text-decoration:none;font-size:.9rem}
body{padding-bottom:84px}
.an-main{max-width:1100px;padding-top:8px}
.an-grid{display:block}
/* ferramentas fixas no topo */
.an-tools{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 6px;margin:0 -2px}
#q{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;box-sizing:border-box}
.an-cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.an-cats::-webkit-scrollbar{display:none}
.an-cats button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-weight:800;font-size:.9rem;color:var(--bark);cursor:pointer}
.an-cats button[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf);color:#fff}
/* produtos */
.an-sec h3{margin:14px 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.an-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.an-item{position:relative;display:flex;flex-direction:column}
.an-add{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:76px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;font:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s}
.an-add .nm{font-weight:800;font-size:.95rem;line-height:1.2}
.an-add .pr{font-weight:700;font-size:.88rem;color:var(--leaf)}
.an-add .qb{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;border-radius:999px;background:var(--leaf);color:#fff;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.an-item.has .an-add{border-color:var(--lime);background:#f6fbf1}
.an-item.off .an-add{opacity:.45;cursor:not-allowed}
.an-add:active,.an-add.pop{transform:scale(.96)}
.an-opt{position:absolute;right:6px;bottom:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;color:var(--leaf);font:inherit;font-weight:800;font-size:.75rem;padding:6px 9px;cursor:pointer;touch-action:manipulation}
.an-item .an-add{flex:1}
/* barra do pedido (celular) */
.an-bar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:10px;border:0;border-radius:16px;background:var(--leaf);color:#fff;padding:14px 16px;font:inherit;box-shadow:0 8px 24px rgba(31,107,42,.35);cursor:pointer}
.an-bar b{font-size:1.1rem}
.an-bar em{margin-left:auto;font-style:normal;font-weight:800}
/* painel do pedido: no celular é uma tela por cima */
.an-cart{display:none}
.an-cart-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.an-cart-head h2{margin:0;flex:1}
.an-close{border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--bark)}
body.cart-open{overflow:hidden}
body.cart-open .an-cart{display:block;position:fixed;inset:0;z-index:30;margin:0;border-radius:0;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
body.cart-open .an-bar{display:none}
.an-lines{list-style:none;margin:0 0 6px;padding:0}
.an-lines li{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}
.an-lines li.empty{display:block;color:var(--muted);text-align:center;border:0}
.an-lines .ln b{display:block;font-size:.95rem}
.an-lines .ln small{display:block;color:var(--muted);font-size:.78rem;font-weight:600}
.lq{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lq button{border:0;background:var(--card);width:40px;height:40px;font-size:1.25rem;font-weight:800;color:var(--leaf);cursor:pointer;touch-action:manipulation}
.lq span{min-width:28px;text-align:center;font-weight:800}
.lv{font-weight:800;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.an-cart input[type=text],.an-cart input[type=tel]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;margin-top:6px}
.an-cart .lbl{display:block;font-weight:800;color:var(--bark);margin:14px 0 6px}
.an-client{margin:6px 0 0;font-size:.85rem;color:var(--leaf);font-weight:700}
.an-chips{display:flex;flex-wrap:wrap;gap:6px}
.an-chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:inherit;font-weight:800;font-size:.92rem;color:var(--bark);cursor:pointer;touch-action:manipulation}
.an-chips button[aria-checked=true]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.an-pct{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:0 12px 0 4px;background:#fff}
.an-pct input{width:62px !important;border:0 !important;margin:0 !important;padding:9px 4px !important;text-align:right;background:transparent !important}
.an-pct.on{border-color:var(--leaf);box-shadow:0 0 0 1px var(--leaf)}
.an-check{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.88rem;font-weight:700;color:var(--ink)}
.an-check input{width:20px;height:20px;accent-color:var(--leaf)}
.an-more{margin-top:12px}
.an-more summary{font-weight:800;color:var(--leaf);cursor:pointer;padding:6px 0}
.an-tot{margin:14px 0 8px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.an-tot div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.an-tot #tDiscRow b{color:#b4321c}
.an-tot .big{font-size:1.25rem}
.an-tot .big b{color:var(--leaf)}
.an-send{width:100%;padding:16px !important;font-size:1.05rem !important}
.an-recent{margin-top:16px}
.an-recent h3{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;color:var(--muted)}
.an-recent ul{list-style:none;margin:0;padding:0}
.an-recent li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.an-recent li span{margin-left:auto;color:var(--muted);font-weight:700}
/* opções do produto */
.an-veil{position:fixed;inset:0;z-index:40;background:rgba(40,30,20,.45);display:flex;align-items:flex-end;justify-content:center}
.an-veil[hidden]{display:none}
.an-sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;margin:0;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.an-sheet h2{margin:0}
.an-sheet fieldset{border:0;margin:12px 0 0;padding:0}
.an-sheet legend{font-weight:800;color:var(--bark);margin-bottom:6px}
.an-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.an-opts label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700;font-size:.9rem;cursor:pointer;background:#fff}
.an-opts label:has(input:checked){border-color:var(--leaf);background:#eef6e6}
.an-opts input{width:18px;height:18px;accent-color:var(--leaf);flex:none}
.an-opts small{color:var(--muted);font-weight:600}
.an-sheet #optObs{width:100%;box-sizing:border-box;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:12px}
.an-qty{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:12px}
.an-qty button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:1.5rem;font-weight:800;color:var(--leaf);cursor:pointer}
.an-qty b{font-size:1.4rem;min-width:30px;text-align:center}
.an-sheet .row{display:flex;gap:8px;margin-top:12px}
.an-sheet .row .btn{flex:1;padding:14px !important}
.empty{text-align:center;color:var(--muted);padding:18px}
.toast{bottom:96px !important}
/* telas grandes: produtos e pedido lado a lado */
@media (min-width:860px){
  body{padding-bottom:24px}
  .an-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
  .an-items{grid-template-columns:repeat(3,minmax(0,1fr))}
  .an-cart{display:block;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto}
  .an-close{display:none}
  .an-bar{display:none !important}
}
@media (min-width:1100px){.an-items{grid-template-columns:repeat(4,minmax(0,1fr))}}
.linkbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:inherit;font-weight:800;font-size:.85rem;color:var(--danger);cursor:pointer}
body.cart-open .toast{top:16px;bottom:auto !important}
</style>
</head>
<body>
<header class="ctop">
  <div class="wrap ctop-in">
    <img data-img="logo" alt="Suco Verde" class="clogo">
    <div class="ctitle"><h1>Anotar pedido</h1><p>Suco Verde · pedido da equipe</p></div>
    <nav class="cnav" aria-label="Outras páginas"><a href="../painel/">Painel</a><a href="../caixa/">Caixa</a></nav>
  </div>
</header>

<!-- Login -->
<div class="wrap" id="loginView" hidden>
  <div class="login">
    <h2>Entre para anotar pedidos</h2>
    <form id="loginForm" novalidate>
      <label class="lbl" for="lEmail">E-mail</label>
      <input type="text" id="lEmail" autocomplete="username" inputmode="email">
      <label class="lbl" for="lPass">Senha</label>
      <input type="password" id="lPass" autocomplete="current-password">
      <p class="err" id="lErr"></p>
      <div class="row"><button type="submit" class="btn solid big" id="lBtn">Entrar</button></div>
    </form>
  </div>
</div>

<main class="wrap an-main" id="appView" hidden>
  <p class="note" id="note" hidden></p>
  <div class="an-grid">
    <!-- PRODUTOS -->
    <section class="an-prod" aria-label="Produtos">
      <div class="an-tools">
        <input type="search" id="q" placeholder="Buscar produto…" aria-label="Buscar produto" autocomplete="off">
        <nav class="an-cats" id="cats" aria-label="Categorias"></nav>
      </div>
      <div id="prodList"></div>
    </section>

    <!-- PEDIDO -->
    <aside class="an-cart card" id="cartPanel" aria-label="Pedido">
      <div class="an-cart-head"><h2>Pedido</h2><button type="button" class="linkbtn" id="clearBtn">Limpar</button><button type="button" class="an-close" id="closeCart" aria-label="Voltar aos produtos">×</button></div>
      <ul class="an-lines" id="lines"></ul>

      <label class="lbl" for="cName">Cliente</label>
      <input type="text" id="cName" list="clientList" autocomplete="off" placeholder="Nome do cliente (opcional)">
      <datalist id="clientList"></datalist>
      <p class="an-client" id="clientInfo" hidden></p>

      <p class="lbl">Desconto</p>
      <div class="an-chips" id="discChips" role="radiogroup" aria-label="Desconto">
        <button type="button" role="radio" data-p="0">Sem</button>
        <button type="button" role="radio" data-p="5">5%</button>
        <button type="button" role="radio" data-p="10">10%</button>
        <button type="button" role="radio" data-p="15">15%</button>
        <button type="button" role="radio" data-p="20">20%</button>
        <span class="an-pct"><input type="text" id="discOther" inputmode="decimal" placeholder="Outro" aria-label="Outro desconto em %"><b>%</b></span>
      </div>
      <label class="an-check" id="rememberWrap" hidden><input type="checkbox" id="remember" checked> <span id="rememberTxt">Lembrar desconto para este cliente</span></label>

      <p class="lbl">Como vai</p>
      <div class="an-chips" id="modeChips" role="radiogroup" aria-label="Como vai">
        <button type="button" role="radio" data-m="balcao">Balcão</button>
        <button type="button" role="radio" data-m="retirada">Retirada</button>
        <button type="button" role="radio" data-m="entrega">Entrega Ceasa</button>
      </div>
      <input type="text" id="cPlace" placeholder="Onde entregar (box, corredor…)" hidden>

      <p class="lbl">Pagamento</p>
      <div class="an-chips" id="payChips" role="radiogroup" aria-label="Pagamento">
        <button type="button" role="radio" data-v="Dinheiro">Dinheiro</button>
        <button type="button" role="radio" data-v="Pix">Pix</button>
        <button type="button" role="radio" data-v="Cartão de débito">Débito</button>
        <button type="button" role="radio" data-v="Cartão de crédito">Crédito</button>
        <button type="button" role="radio" data-v="A pagar">A pagar</button>
      </div>

      <details class="an-more">
        <summary>WhatsApp e observação</summary>
        <input type="tel" id="cPhone" inputmode="tel" placeholder="WhatsApp do cliente (opcional)">
        <input type="text" id="cObs" maxlength="300" placeholder="Observação do pedido">
      </details>

      <div class="an-tot">
        <div><span>Subtotal</span><b id="tSub">R$ 0,00</b></div>
        <div id="tDiscRow" hidden><span id="tDiscLbl">Desconto</span><b id="tDisc">− R$ 0,00</b></div>
        <div class="big"><span>Total</span><b id="tTot">R$ 0,00</b></div>
      </div>
      <p class="err" id="sendErr"></p>
      <button type="button" class="btn solid big an-send" id="sendBtn">Enviar pedido</button>

      <div class="an-recent" id="recentBox" hidden>
        <h3>Enviados agora</h3>
        <ul id="recent"></ul>
      </div>
    </aside>
  </div>
</main>

<!-- barra do pedido (celular) -->
<button type="button" class="an-bar" id="cartBar" hidden><span id="barCount">0 itens</span><b id="barTot">R$ 0,00</b><em>Ver pedido →</em></button>

<!-- opções do produto -->
<div class="an-veil" id="optVeil" hidden>
  <form class="an-sheet card" id="optForm" novalidate>
    <h2 id="optTitle"></h2>
    <p class="sub" id="optSub"></p>
    <div id="optBody"></div>
    <input type="text" id="optObs" maxlength="120" placeholder="Observação do item (opcional)">
    <div class="an-qty"><button type="button" id="oMinus" aria-label="Menos">−</button><b id="oQty">1</b><button type="button" id="oPlus" aria-label="Mais">+</button></div>
    <p class="err" id="optErr"></p>
    <div class="row"><button type="button" class="btn" id="optCancel">Cancelar</button><button type="submit" class="btn solid" id="optOk">Adicionar</button></div>
  </form>

function renderProducts(){
  const qq=norm(q), cs=cats().filter(c=>!cat||c.id===cat||qq);
  const html=cs.map(c=>{const its=c.itens.map((it,i)=>({it,i})).filter(({it})=>!qq||norm(it.n).includes(qq));if(!its.length)return "";
    return `<section class="an-sec"><h3>${esc(c.nome)}</h3><div class="an-items">${its.map(({it,i})=>{const n=inCart(it.n);return `<div class="an-item${it.off?" off":""}${n?" has":""}">
      <button type="button" class="an-add" data-c="${esc(c.id)}" data-i="${i}" ${it.off?"disabled":""}><span class="nm">${esc(it.n)}</span><span class="pr">${it.off?"Esgotado":brl(it.p)}</span>${n?`<span class="qb">${n}</span>`:""}</button>
      ${!it.off&&hasExtras(it)&&!needsSheet(it)?`<button type="button" class="an-opt" data-c="${esc(c.id)}" data-i="${i}" aria-label="Opções de ${esc(it.n)}">+ opções</button>`:""}
    </div>`}).join("")}</div></section>`}).join("");
  $("prodList").innerHTML=html||`<p class="empty">Nenhum produto encontrado.</p>`;
}
$("cats").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;cat=b.dataset.c;renderCats();renderProducts();window.scrollTo({top:0,behavior:"smooth"})});
$("q").addEventListener("input",e=>{q=e.target.value;renderProducts()});
$("prodList").addEventListener("click",e=>{
  const b=e.target.closest("[data-i]");if(!b||b.disabled)return;
  const c=(DATA.cats||[]).find(x=>x.id===b.dataset.c), it=c&&c.itens[+b.dataset.i];if(!it)return;
  if(b.classList.contains("an-opt")||needsSheet(it)){openOpt(it);return}
  addLine({n:it.n,u:it.p,q:1,det:"",ex:[],obs:""});
  b.classList.add("pop");setTimeout(()=>b.classList.remove("pop"),250);
});

/* ---------- opções ---------- */
let cur=null, oq=1;
function openOpt(it){
  cur=it; oq=1; const o=it.o||[]; let h="";
  if(o.includes("pick2")) h+=`<fieldset><legend>2 recheios</legend><div class="an-opts">${(DATA.recheios||[]).map((r,k)=>`<label><input type="checkbox" name="pick2" value="${esc(r)}"><span>${esc(r)}</span></label>`).join("")}</div></fieldset>`;
  if(o.includes("sabor")) h+=`<fieldset><legend>Sabor</legend><div class="an-opts">${(DATA.sabores||[]).map(s=>`<label><input type="radio" name="sabor" value="${esc(s.n)}" ${s.off?"disabled":""}><span>${esc(s.n)}${s.off?" (acabou)":""}</span></label>`).join("")}</div></fieldset>`;
  if(o.includes("extras")&&comp()){const ex=comp().itens.filter(e=>!e.off);if(ex.length)h+=`<fieldset><legend>Complementos</legend><div class="an-opts">${ex.map(e=>`<label><input type="checkbox" name="extra" value="${esc(e.n)}" data-p="${+e.p}"><span>${esc(e.n)} <small>+ ${brl(e.p)}</small></span></label>`).join("")}</div></fieldset>`}
  $("optTitle").textContent=it.n; $("optSub").textContent=brl(it.p); $("optBody").innerHTML=h; $("optObs").value=""; $("optErr").textContent=""; updOpt();
  $("optVeil").hidden=false;
}
function optUnit(){return cur.p+[...document.querySelectorAll('#optBody input[name=extra]:checked')].reduce((a,x)=>a+(+x.dataset.p||0),0)}
function updOpt(){$("oQty").textContent=oq;$("optOk").textContent="Adicionar · "+brl(optUnit()*oq);
  const pk=[...document.querySelectorAll('#optBody input[name=pick2]')],n=pk.filter(x=>x.checked).length;pk.forEach(x=>x.disabled=!x.checked&&n>=2)}
$("optBody").addEventListener("change",()=>{$("optErr").textContent="";updOpt()});
$("oMinus").onclick=()=>{if(oq>1){oq--;updOpt()}}; $("oPlus").onclick=()=>{if(oq<99){oq++;updOpt()}};
$("optCancel").onclick=()=>{$("optVeil").hidden=true};
$("optVeil").addEventListener("click",e=>{if(e.target===$("optVeil"))$("optVeil").hidden=true});
$("optForm").addEventListener("submit",e=>{e.preventDefault();const o=cur.o||[],det=[];
  if(o.includes("pick2")){const p=[...document.querySelectorAll('#optBody input[name=pick2]:checked')].map(x=>x.value);if(p.length!==2){$("optErr").textContent="Escolha 2 recheios.";return}det.push(p.join(" e "))}
  if(o.includes("sabor")){const s=document.querySelector('#optBody input[name=sabor]:checked');if(!s){$("optErr").textContent="Escolha o sabor.";return}det.push(s.value)}
  const ex=[...document.querySelectorAll('#optBody input[name=extra]:checked')].map(x=>x.value);
  addLine({n:cur.n,u:optUnit(),q:oq,det:det.join(", "),ex,obs:$("optObs").value.trim()});$("optVeil").hidden=true});

/* ---------- pedido ---------- */
function addLine(l){const s=lines.find(x=>x.n===l.n&&x.det===l.det&&x.obs===l.obs&&x.ex.join()===l.ex.join()&&x.u===l.u);if(s)s.q+=l.q;else lines.push(l);changed();toast(l.n+" adicionado")}
const sub=()=>r2(lines.reduce((a,l)=>a+l.u*l.q,0));
const discV=()=>r2(sub()*pct/100);
function changed(){persist();renderLines();renderProducts();renderTotals()}
function renderLines(){
  $("lines").innerHTML=lines.length?lines.map((l,i)=>`<li><div class="ln"><b>${esc(l.n)}</b>${l.det||l.ex.length||l.obs?`<small>${esc([l.det,...l.ex.map(x=>"+ "+x),l.obs?"Obs.: "+l.obs:""].filter(Boolean).join(" · "))}</small>`:""}</div>
    <div class="lq"><button type="button" data-d="-1" data-l="${i}" aria-label="Menos">−</button><span>${l.q}</span><button type="button" data-d="1" data-l="${i}" aria-label="Mais">+</button></div><span class="lv">${brl(l.u*l.q)}</span></li>`).join(""):`<li class="empty">Toque nos produtos para adicionar.</li>`;
}
$("lines").addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(!b)return;const l=lines[+b.dataset.l];l.q+=+b.dataset.d;if(l.q<=0)lines.splice(+b.dataset.l,1);changed()});
let clearArm=false;
$("clearBtn").addEventListener("click",()=>{if(!lines.length)return;if(!clearArm){clearArm=true;$("clearBtn").textContent="Toque de novo";setTimeout(()=>{clearArm=false;$("clearBtn").textContent="Limpar"},2500);return}clearArm=false;$("clearBtn").textContent="Limpar";resetOrder()});
function renderTotals(){
  const s=sub(),d=discV(),t=r2(s-d),n=lines.reduce((a,l)=>a+l.q,0);
  $("tSub").textContent=brl(s);$("tDiscRow").hidden=!pct;$("tDiscLbl").textContent="Desconto "+String(pct).replace(".",",")+"%";$("tDisc").textContent="− "+brl(d);$("tTot").textContent=brl(t);
  $("barCount").textContent=n+(n===1?" item":" itens");$("barTot").textContent=brl(t);$("cartBar").hidden=!n;
  document.querySelectorAll("#discChips [data-p]").forEach(b=>b.setAttribute("aria-checked",+b.dataset.p===pct));
  if(![0,5,10,15,20].includes(pct)){if(document.activeElement!==$("discOther"))$("discOther").value=String(pct).replace(".",",");$("discOther").parentNode.classList.add("on")}else{if(document.activeElement!==$("discOther"))$("discOther").value="";$("discOther").parentNode.classList.remove("on")}
  document.querySelectorAll("#modeChips [data-m]").forEach(b=>b.setAttribute("aria-checked",b.dataset.m===mode));$("cPlace").hidden=mode!=="entrega";
  document.querySelectorAll("#payChips [data-v]").forEach(b=>b.setAttribute("aria-checked",b.dataset.v===pay));
  $("sendBtn").textContent=n?"Enviar pedido · "+brl(t):"Enviar pedido";
  clientUi();
}
function setPct(v,manual){pct=Math.max(0,Math.min(100,r2(v||0)));if(manual)pctTouched=true;persist();renderTotals()}
$("discChips").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(!b)return;setPct(+b.dataset.p,true)});
$("discOther").addEventListener("input",e=>{const v=num(e.target.value);setPct(isNaN(v)?0:v,true)});
$("modeChips").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;mode=b.dataset.m;persist();renderTotals();if(mode==="entrega")$("cPlace").focus()});
$("payChips").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;pay=pay===b.dataset.v?"":b.dataset.v;persist();renderTotals()});

/* ---------- clientes e desconto ---------- */
function clientOf(){const n=$("cName").value.trim();return n?CL[keyOf(n)]||null:null}
function clientUi(){
  const n=$("cName").value.trim(), c=clientOf();
  $("clientInfo").hidden=!c; if(c)$("clientInfo").innerHTML=`Cliente cadastrado${c.desconto?`: desconto de <b>${String(c.desconto).replace(".",",")}%</b>`:" sem desconto"}${c.telefone?" · "+esc(c.telefone):""}`;
  const saved=c?(+c.desconto||0):0, show=!!n&&pct!==saved;
  $("rememberWrap").hidden=!show; if(show)$("rememberTxt").textContent=pct?`Lembrar ${String(pct).replace(".",",")}% de desconto para ${n}`:`Tirar o desconto de ${n} nos próximos pedidos`;
}
function renderClientList(){$("clientList").innerHTML=Object.values(CL).sort((a,b)=>(b.vezes||0)-(a.vezes||0)).map(c=>`<option value="${esc(c.nome)}">${c.desconto?esc(c.desconto+"% de desconto"):""}</option>`).join("")}
$("cName").addEventListener("input",()=>{const c=clientOf();if(c&&!pctTouched){pct=+c.desconto||0;if(c.telefone&&!$("cPhone").value)$("cPhone").value=c.telefone}else if(!c&&!pctTouched)pct=0;persist();renderTotals()});

/* ---------- enviar ---------- */
function resetOrder(){lines=[];pct=0;pctTouched=false;pay="";mode="balcao";$("cName").value="";$("cPhone").value="";$("cObs").value="";$("cPlace").value="";$("sendErr").textContent="";changed()}
$("sendBtn").addEventListener("click",async()=>{
  if(sending)return; $("sendErr").textContent="";
  if(!lines.length){$("sendErr").textContent="Adicione pelo menos um produto.";return}
  if(mode==="entrega"&&!$("cPlace").value.trim()){$("sendErr").textContent="Diga onde entregar.";$("cPlace").focus();return}
  const s=sub(),d=discV(),nome=$("cName").value.trim(),tel=$("cPhone").value.replace(/\D/g,"");
  const doc={origem:"equipe",status:"novo",dia:tzDate(new Date()),cliente:nome.slice(0,80),modo:mode,pagamento:pay||"Não informado",subtotal:s,total:r2(s-d),
    itens:lines.map(l=>({q:l.q,n:l.n,v:r2(l.u*l.q),det:l.det?[l.det]:[],ex:l.ex||[],obs:l.obs||""})),por:be.email?be.email():""};
  if(pct>0)doc.desconto={pct,valor:d};
  if(tel.length>=10&&tel.length<=11)doc.telefone=tel;
  if(mode==="entrega")doc.local=$("cPlace").value.trim().slice(0,200);
  const obs=$("cObs").value.trim();if(obs)doc.obs=obs.slice(0,300);
  sending=true;$("sendBtn").disabled=true;$("sendBtn").textContent="Enviando…";
  try{
    const id=await be.add(doc);
    if(nome){const k=keyOf(nome),c=CL[k]||{};const patch={nome,vezes:(+c.vezes||0)+1,ultimo:doc.dia,desconto:+c.desconto||0};
      if(!$("rememberWrap").hidden&&$("remember").checked)patch.desconto=pct;
      if(doc.telefone)patch.telefone=doc.telefone;
      be.saveClient(k,patch).then(()=>{CL[k]=Object.assign({},c,patch);renderClientList()}).catch(()=>{})}
    recent.unshift({code:String(id).slice(0,4).toUpperCase(),nome:nome||"Sem nome",total:doc.total,pct});recent=recent.slice(0,5);renderRecent();
    toast("Pedido #"+String(id).slice(0,4).toUpperCase()+" enviado ao painel");
    resetOrder(); closeCart();
  }catch(err){$("sendErr").textContent=err&&err.code==="permission-denied"?"Sua conta não tem permissão para criar pedidos.":"Não consegui enviar. Confira a internet e tente de novo."}
  sending=false;$("sendBtn").disabled=false;renderTotals();
});
function renderRecent(){$("recentBox").hidden=!recent.length;$("recent").innerHTML=recent.map(r=>`<li><b>#${esc(r.code)}</b> ${esc(r.nome)}<span>${brl(r.total)}${r.pct?` · ${String(r.pct).replace(".",",")}% off`:""}</span></li>`).join("")}

/* ---------- celular: abrir/fechar o pedido ---------- */
function openCart(){document.body.classList.add("cart-open");$("cartPanel").scrollTop=0}
function closeCart(){document.body.classList.remove("cart-open")}
$("cartBar").addEventListener("click",openCart);
$("closeCart").addEventListener("click",closeCart);

/* ---------- utilidades ---------- */
let tT=null;
function toast(t){$("toast").textContent=t;$("toast").hidden=false;clearTimeout(tT);tT=setTimeout(()=>$("toast").hidden=true,1600)}
function note(t){$("note").textContent=t||"";$("note").hidden=!t}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();const em=$("lEmail").value.trim(),pw=$("lPass").value;
  if(!em||!pw){$("lErr").textContent="Preencha e-mail e senha.";return}
  $("lBtn").disabled=true;$("lErr").textContent="";
  try{await be.signIn(em,pw)}catch(err){const c=err&&err.code||"";$("lErr").textContent=/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?"E-mail ou senha incorretos.":"Não consegui entrar agora. Confira a internet."}
  $("lBtn").disabled=false;
});
let started=false;
renderCats();renderProducts();renderLines();renderTotals();
(async function(){
  try{be=await backend()}catch(e){$("loginView").hidden=false;$("lErr").textContent="Não consegui carregar o sistema. Recarregue a página.";return}
  be.onAuth(u=>{
    if(!u){$("appView").hidden=true;$("cartBar").hidden=true;$("loginView").hidden=false;return}
    $("loginView").hidden=true;$("appView").hidden=false;renderTotals();
    if(started)return;started=true;
    be.watchMenu(d=>{if(d&&Array.isArray(d.cats)){DATA=d;renderCats();renderProducts()}});
    be.watchClients(c=>{CL=c||{};renderClientList();renderTotals()});
  });
})();
})();
</script>
</body>
</html>
